global:
  environment: fallback-local

replicaCount: 1

image:
  repository: employee-management-api
  tag: 1.0.0
  pullPolicy: IfNotPresent

platformTeam:
  email: dev-support@company.com

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: "nginx"
  host: api.local.dev
  annotations:
    kubernetes.io/ingress.class: "nginx"

hpa:
  enabled: false

probes:
  liveness:
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 2
    successThreshold: 1
    failureThreshold: 2

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

